<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vector Autonomous Systems OG Image</title>
  <desc id="desc">Hydrogen-hybrid cargo VTOL concept artwork for Vector Autonomous Systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08162a"/>
      <stop offset="100%" stop-color="#123d70"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#1e8ae8"/>
      <stop offset="100%" stop-color="#7fd4ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="180" fill="#1e8ae8" opacity=".12"/>
  <circle cx="240" cy="520" r="210" fill="#f06820" opacity=".10"/>
  <g opacity=".2" stroke="#7fd4ff">
    <path d="M0 520H1200"/>
    <path d="M0 560H1200"/>
    <path d="M0 600H1200"/>
    <path d="M160 0V630"/>
    <path d="M240 0V630"/>
    <path d="M320 0V630"/>
  </g>
  <g transform="translate(720 286)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="url(#accent)"/>
    <rect x="-220" y="-6" width="120" height="12" rx="6" fill="url(#accent)"/>
    <rect x="100" y="-6" width="120" height="12" rx="6" fill="url(#accent)"/>
    <circle cx="-230" cy="-92" r="24" fill="none" stroke="#7fd4ff" stroke-width="6"/>
    <circle cx="230" cy="-92" r="24" fill="none" stroke="#7fd4ff" stroke-width="6"/>
    <circle cx="-230" cy="92" r="24" fill="none" stroke="#7fd4ff" stroke-width="6"/>
    <circle cx="230" cy="92" r="24" fill="none" stroke="#7fd4ff" stroke-width="6"/>
    <rect x="-58" y="70" width="116" height="48" rx="14" fill="#0b1f3a" stroke="#7fd4ff" stroke-width="3"/>
  </g>
  <text x="86" y="146" fill="#7fd4ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">VECTOR AUTONOMOUS SYSTEMS</text>
  <text x="86" y="248" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900">Будущее логистики</text>
  <text x="86" y="320" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900">автономное и водородное</text>
  <text x="86" y="392" fill="#d8e6f5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">VTOL H2 HYBRID • Cargo missions with range, speed and low emissions</text>
  <rect x="86" y="448" width="220" height="58" rx="14" fill="#f06820"/>
  <text x="196" y="486" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">Зарезервировать</text>
</svg>
