<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Card</title>

  <style>
    :root{
      --glass: rgba(0,0,0,.55);
      --glass2: rgba(255,255,255,.08);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --accent: #2ecc71;
      --radius: 18px;
    }
    *{ box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.8)),
        url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=70");
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    /* DESKTOP GATE */
    .desktopGate{
      display:none;
      width:min(640px,96vw);
      background:var(--glass);
      backdrop-filter:blur(12px);
      border-radius:var(--radius);
      padding:24px;
      border:1px solid rgba(255,255,255,.12);
      animation:pop .3s ease-out both;
    }
    .gateRow{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
    .qrBox{
      width:180px;height:180px;
      background:#fff;border-radius:14px;
      padding:10px;
    }
    .qrBox img{width:100%;height:100%;object-fit:contain}

    /* CARD */
    .card{
      width:100%;max-width:440px;
      background:var(--glass);
      backdrop-filter:blur(12px);
      border-radius:var(--radius);
      padding:22px;
      border:1px solid rgba(255,255,255,.12);
      animation:pop .3s ease-out both;
    }

    .topBar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .brand{display:flex;gap:12px;align-items:center}
    .brand img{width:40px;height:40px;border-radius:12px;object-fit:cover}
    .langToggle button{
      border:none;background:rgba(255,255,255,.08);
      color:var(--text);border-radius:999px;
      padding:6px 10px;font-size:12px;cursor:pointer
    }
    .langToggle .active{background:rgba(46,204,113,.3)}

    h1{margin:6px 0}
    .subtitle{color:var(--muted);font-size:14px;margin-bottom:14px}

    .row{display:flex;gap:12px}
    input{
      width:100%;padding:14px;
      background:var(--glass2);
      border:none;border-radius:12px;
      color:var(--text);margin-bottom:12px
    }

    .chips{display:flex;gap:10px;justify-content:center;margin-top:4px}
    .chip{display:flex;align-items:center;gap:6px;font-size:14px;padding:8px 12px;border-radius:999px;background:var(--glass2)}
    .actions{display:flex;gap:10px;margin-top:10px}
    .btn{
      flex:1;border:none;border-radius:14px;
      padding:14px;font-size:16px;font-weight:700;
      cursor:pointer
    }
    .btnPrimary{background:var(--accent);color:#061006}
    .btnGhost{background:rgba(255,255,255,.08);color:var(--text)}

    .mini{margin-top:12px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
    .mini a{color:var(--text);cursor:pointer}

    #mobileQRBox{display:none;text-align:center;margin-top:12px}
    #mobileQRBox img{width:160px;background:#fff;padding:10px;border-radius:14px}

    @keyframes pop{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:none}
    }
  </style>
</head>

<body>

<!-- DESKTOP -->
<section class="desktopGate" id="desktopGate">
  <h1>Open on your phone 📱</h1>
  <p class="subtitle">Scan the QR code to open the mobile contact card.</p>
  <div class="gateRow">
    <div class="qrBox">
      <img src="oneix_mobile_qr.png" alt="QR">
    </div>

  </div>
</section>


<!-- andreasandreou1977@gmail.comMOBILE -->
<form class="card" id="mobileCard"
      action="https://formsubmit.co/michaelok929@gmail.com"
      method="POST">

  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" value="https://www.oneix.ltd/mobile/thankyou.html">

  <div class="topBar">
    <div class="brand">
      <img src="logo.png" onerror="this.style.display='none'">
      <strong id="brandName">Andreas Andreas</strong>
    </div>
    <div class="langToggle">
      <button type="button" id="btnEN" class="active">EN</button>
      <button type="button" id="btnRU">RU</button>
      <button type="button" id="btnGR">GR</button>
    </div>
  </div>

  <div class="subtitle" style="margin-top:0" id="tagline">KW SEVEN</div>

  <h1 id="title">Welcome</h1>
  <p class="subtitle" id="subtitle">Leave your contact details.</p>

  <div class="row">
    <input name="first_name" id="first" placeholder="First name" required>
    <input name="last_name" id="last" placeholder="Last name" required>
  </div>

  <input name="email" type="email" placeholder="Email" required>
  <input name="phone" type="tel" placeholder="Phone">

  <div class="chips">
    <label class="chip"><input type="checkbox" name="interest[]" value="Buy"> <span id="buy">Buy</span></label>
    <label class="chip"><input type="checkbox" name="interest[]" value="Sell"> <span id="sell">Sell</span></label>
  </div>

  <div class="actions">
    <button type="submit" class="btn btnPrimary" id="submitBtn">Submit</button>
    <button type="button" class="btn btnGhost" id="vcardBtn">Save contact</button>
  </div>

  <div class="mini">
    <span id="qrText">Show QR</span>
    <a id="miniQRLink">QR</a>
  </div>

  <div id="mobileQRBox">
    <img src="oneix_mobile_qr.png" alt="QR">
  </div>
</form>

<script>
  /* DEVICE */
  const isDesktop = window.matchMedia("(pointer:fine)").matches && window.innerWidth > 900;
  if(isDesktop){
    document.getElementById("desktopGate").style.display="block";
    document.getElementById("mobileCard").style.display="none";
  }

  /* QR toggle */
  document.getElementById("miniQRLink").onclick = ()=>{
    const box=document.getElementById("mobileQRBox");
    box.style.display = box.style.display==="none"?"block":"none";
  };

  /* LANG */
  const T={
    en:{title:"Welcome",subtitle:"Leave your contact details.",buy:"Buy",sell:"Sell"},
    ru:{title:"Добро пожаловать",subtitle:"Оставьте ваши контакты.",buy:"Купить",sell:"Продать"},
    gr:{title:"Καλώς ήρθατε",subtitle:"Αφήστε τα στοιχεία επικοινωνίας σας.",buy:"Αγορά",sell:"Πώληση"}
  };
  function setLang(l){
    title.innerText=T[l].title;
    subtitle.innerText=T[l].subtitle;
    buy.innerText=T[l].buy;
    sell.innerText=T[l].sell;
    btnEN.classList.toggle("active",l==="en");
    btnRU.classList.toggle("active",l==="ru");
    btnGR.classList.toggle("active",l==="gr");
  }
  btnEN.onclick=()=>setLang("en");
  btnRU.onclick=()=>setLang("ru");
  btnGR.onclick=()=>setLang("gr");

  /* vCard */
  vcardBtn.onclick=()=>{
    const v=`BEGIN:VCARD
VERSION:3.0
FN:Andreas Andreas
TEL:99424203
END:VCARD`;
    const b=new Blob([v],{type:"text/vcard"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="oneix.vcf";
    a.click();
  };
</script>

</body>
</html>
